# One stack per session. Nothing here is pinned to a fixed name, because two sessions running
# this repo at once used to fight over both the container name and the host port.
#
# Compose derives the project name from the directory, so a git worktree at
# ../BeyondTheCliff-<name> gets its own container automatically with no flag to remember. Only
# the host port still has to be chosen, via TRACKER_PORT in that worktree's .env (gitignored,
# and NOT carried into a new worktree: set it per worktree). See docs/technical/PARALLEL_SESSIONS.md.
services:
  tracker:
    build: .
    # No container_name on purpose: hardcoding one makes the second session's `up` fail with a
    # name conflict. Compose names it <project>-tracker-1, which is unique per worktree.
    ports:
      # Host TRACKER_PORT (default 8002), container 8000. The host side is what must be unique
      # per session; uvicorn always listens on 8000 inside the container. 8000 and 8001 are
      # taken by other projects on this Mac.
      - "${TRACKER_PORT:-8002}:8000"
    volumes:
      # The repo is mounted, not copied: /admin writes data/*.csv (the committed source of
      # truth) and rebuilds the DB, so those writes must land on the host where git sees
      # them. This also gives uvicorn --reload real files to watch.
      - .:/srv
      # Keep the container's installed packages from being shadowed by the host .venv and
      # by host bytecode caches built for a different interpreter path.
      - /srv/.venv
    # Measured on this repo: uvicorn idles at ~84 MiB and scripts/build_db.py peaks at
    # ~30 MiB RSS. 512m is roughly 5x headroom and still bounds the container on a
    # memory-limited host.
    mem_limit: 512m
    restart: unless-stopped
